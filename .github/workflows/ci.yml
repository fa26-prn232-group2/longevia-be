name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Feature registry check
        run: make team-check

      - name: Benchmark tooling correctness (does not run or claim SC-006)
        run: |
          python3 -m unittest discover -s scripts/progress/benchmark -p 'test_*.py' -v
          dotnet build scripts/progress/benchmark/Seed/Seed.csproj -c Release -warnaserror
          dotnet format scripts/progress/benchmark/Seed/Seed.csproj --verify-no-changes --no-restore

      - name: Gate (format-check + build Release + test + vulnerability scan)
        run: make check

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            dockerfile: src/Services/Identity/Dockerfile
          - service: diet
            dockerfile: src/Services/Diet/Dockerfile
          - service: progress
            dockerfile: src/Services/Progress/Dockerfile
          - service: recommendation
            dockerfile: src/Services/Recommendation/Recommendation.Api/Dockerfile
          - service: worker
            dockerfile: src/Services/Worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: longevia-${{ matrix.service }}:ci
