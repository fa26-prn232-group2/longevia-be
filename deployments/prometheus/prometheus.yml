# Prometheus scrape configuration — Longevia local observability (US4, FR-009).
# Scrapes every service /metrics endpoint every 10s. Targets use Docker
# embedded-DNS names + container ports only (no host ports here).
#
# NOTE (T019): there is deliberately NO RabbitMQ target. Enabling the
# `rabbitmq_prometheus` plugin is NOT trivially enableable in compose — it
# needs a `command:` override (rabbitmq-plugins enable) or an
# enabled_plugins mount on the stable rabbitmq:4-management service — and
# scraping it would force prometheus onto `data_net`, contradicting
# plan.md §7 (prometheus lives on `edge` only; identity/worker are reachable
# there because they join both edge + data_net).

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: diet
    metrics_path: /metrics
    static_configs:
      - targets:
          - diet:8080

  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity:8080

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
