# Grafana datasource provisioning (US4, FR-010): Prometheus is wired
# automatically at first boot — zero manual setup (SC-004).
apiVersion: 1

datasources:
  - name: Prometheus
    # Pinned so provisioned dashboards can reference it by uid. Without a fixed
    # uid Grafana generates a random one per instance and every panel breaks.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
