name: progress-benchmark
services:
  progress-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: progress_db
      POSTGRES_USER: progress_user
      POSTGRES_PASSWORD: ${BENCH_PASSWORD:?}
    ports: ["127.0.0.1:${PG_PORT:?}:5432"]
    mem_limit: 512m
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progress_user -d progress_db"]
      interval: 2s
      retries: 40
  identity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_user
      POSTGRES_PASSWORD: ${BENCH_PASSWORD:?}
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity_user -d identity_db"]
      interval: 2s
      retries: 40
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: benchmark
      RABBITMQ_DEFAULT_PASS: ${BENCH_PASSWORD:?}
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      retries: 40
  identity:
    image: longevia-identity:benchmark
    build:
      context: ../../..
      dockerfile: src/Services/Identity/Dockerfile
      labels: {org.opencontainers.image.revision: "${GIT_SHA:?}"}
    environment:
      ConnectionStrings__Identity: "Host=identity-db;Database=identity_db;Username=identity_user;Password=${BENCH_PASSWORD};Maximum Pool Size=40"
      Jwt__Issuer: progress-benchmark
      Jwt__Audience: benchmark-clients
      Jwt__KeyId: benchmark
      Jwt__SigningPublicKey: ${JWT_PUBLIC:?}
      Jwt__SigningPrivateKey: ${JWT_PRIVATE:?}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: benchmark
      RabbitMQ__Password: ${BENCH_PASSWORD}
      Logging__LogLevel__Default: Warning
      IDENTITY__HTTP_PORT: 8080
      IDENTITY__GRPC_PORT: 50051
    ports: ["127.0.0.1:${IDENTITY_PORT:?}:8080"]
    mem_limit: 384m
    cpus: 1
    depends_on:
      identity-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  progress:
    image: longevia-progress:benchmark
    build:
      context: ../../..
      dockerfile: src/Services/Progress/Dockerfile
      labels: {org.opencontainers.image.revision: "${GIT_SHA:?}"}
    environment:
      ConnectionStrings__Progress: "Host=progress-db;Database=progress_db;Username=progress_user;Password=${BENCH_PASSWORD};Maximum Pool Size=80"
      Jwt__Issuer: progress-benchmark
      Jwt__Audience: benchmark-clients
      Jwt__KeyId: benchmark
      Jwt__SigningPublicKey: ${JWT_PUBLIC:?}
      IdentityGrpc__Address: http://identity:50051
      IdentityGrpc__DeadlineMilliseconds: 2000
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: benchmark
      RabbitMQ__Password: ${BENCH_PASSWORD}
      Logging__LogLevel__Default: Warning
    ports: ["127.0.0.1:${PROGRESS_PORT:?}:8080"]
    mem_limit: 512m
    cpus: 2
    depends_on:
      progress-db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  generator:
    image: grafana/k6:1.3.0
    profiles: [load]
    user: "0:0"
    volumes:
      - ../../../artifacts/progress-benchmark:/output
      - ./:/scripts:ro
    environment:
      BASE_URL: http://progress:8080
    mem_limit: 512m
    cpus: 2
