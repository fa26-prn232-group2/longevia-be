name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Feature registry check
        run: make team-check

      - name: Benchmark tooling correctness (does not run or claim SC-006)
        run: |
          python3 -m unittest discover -s scripts/progress/benchmark -p 'test_*.py' -v
          dotnet build scripts/progress/benchmark/Seed/Seed.csproj -c Release -warnaserror
          dotnet format scripts/progress/benchmark/Seed/Seed.csproj --verify-no-changes --no-restore

      - name: Gate (format-check + build Release + test + vulnerability scan)
        run: make check

      - name: Build Progress image with canonical Identity proto
        run: docker build -f src/Services/Progress/Dockerfile -t longevia-progress:ci .
