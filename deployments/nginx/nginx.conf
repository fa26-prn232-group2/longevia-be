# Longevia API Gateway (Nginx).
#
# Only the client-facing services are exposed here: Identity, Diet, Progress.
# Recommendation is internal (gRPC-only) and is never routed through Nginx.
#
# The public URL is prefixed per service; the prefix is stripped before the
# request reaches the service, so each service owns its own route names.
#   /api/identity/**  -> identity:8080/**
#   /api/diet/**      -> diet:8080/**
#   /api/progress/**  -> progress:8080/**
#
# Auth: the gateway performs no authentication and no authorization. It only
# strips the prefix and forwards. Every service validates the bearer token
# itself (ES256, public key from env - see docs/decisions/001).
#
# TODO - not configured yet, tracked in
# specs/mavil-001-infra-observability/deferred.md:
#   - D-04 No TLS/HSTS: only `listen 80` below, so tokens currently cross the
#     network in plaintext. architecture.md already describes the gateway as
#     HTTP/HTTPS.
#   - D-02 No `limit_req` at the edge: rate limiting is deliberately out of
#     scope for this feature (see deferred.md D-02 for the decision).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting: general API 30 r/s per IP; auth endpoints 5 r/s.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

    # UTF-8 everywhere: error JSON below carries Vietnamese text, so charset
    # must be appended to JSON responses (text/html is always covered).
    charset utf-8;
    charset_types application/json application/problem+json;

    # SSE/WebSocket support: forwards the caller's Upgrade intent, falling
    # back to "close" for plain HTTP (keeps keepalive working).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker embedded DNS. Combined with variable proxy_pass below, this lets
    # Nginx start even before the backend services are up, and re-resolve
    # names on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Forwarding headers, inherited by every location below.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/WebSocket upgrade handshake passthrough. Plain HTTP requests
        # send Connection: close (keepalive preserved); WS/SSE send upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Upstream timeouts. read_timeout is long so SSE streams are not cut.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        # Rate limit all API traffic; auth gets a stricter bucket below.
        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;

        # Unknown routes -> RFC 7807 ProblemDetails JSON in Vietnamese (UTF-8).
        # Only gateway-level 404s land here (no proxy_intercept_errors, so a
        # backend's own 404 body passes through untouched).
        error_page 404 = @notfound;
        location @notfound {
            default_type application/problem+json;
            return 404 '{"type":"https://longevia.com/errors/not-found","title":"Không tìm thấy","status":404,"detail":"Đường dẫn API không tồn tại hoặc phương thức không được hỗ trợ."}';
        }


        # Upstream unavailable/timeout -> RFC 7807 ProblemDetails JSON in Vietnamese (UTF-8).
        error_page 502 503 504 /gateway_error;
        location = /gateway_error {
            internal;
            default_type application/problem+json;
            return 502 '{"type":"https://tools.ietf.org/html/rfc7807","title":"Dịch vụ không khả dụng","status":502,"detail":"Không thể kết nối đến dịch vụ phía sau hoặc dịch vụ đang khởi động."}\n';
        }

        error_page 429 = @ratelimited;
        location @ratelimited {
            default_type application/problem+json;
            return 429 '{"type":"https://tools.ietf.org/html/rfc7807","title":"Quá nhiều yêu cầu","status":429,"detail":"Bạn đã gửi quá nhiều yêu cầu. Vui lòng thử lại sau."}\n';
        }

        location /api/identity/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;
            set $identityauth http://identity:8080;
            rewrite ^/api/identity/(.*)$ /$1 break;
            proxy_pass $identityauth;
        }

        # Gateway liveness, independent of backends.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Combined Swagger UI (dev). Served by the `swagger-ui` container.
        location = /swagger {
            return 301 /swagger/;
        }

        location /swagger/ {
            set $swaggerui http://swagger-ui:8080;
            rewrite ^/swagger/(.*)$ /$1 break;
            proxy_pass $swaggerui;
        }

        location /api/identity/ {
            set $identity http://identity:8080;
            rewrite ^/api/identity/(.*)$ /$1 break;
            proxy_pass $identity;
        }

        location /api/diet/ {
            set $diet http://diet:8080;
            rewrite ^/api/diet/(.*)$ /$1 break;
            proxy_pass $diet;
        }

        location /api/progress/ {
            set $progress http://progress:8080;
            rewrite ^/api/progress/(.*)$ /$1 break;
            proxy_pass $progress;
        }
    }
}
