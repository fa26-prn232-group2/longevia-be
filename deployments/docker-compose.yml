name: longevia

# Local == production: the same images and this same file are used in both.
# Copy ../.env.example to ../.env before running.
#
#   docker compose -f deployments/docker-compose.yml up -d
#
# Backend services are added below once their Dockerfiles exist.
#
# Networks (required by ADR 001 section 2.2 - do not flatten these into one):
#
#   edge        nginx + client-facing services. This is the only network the
#               public boundary touches, and `swagger-ui` sits here too.
#   internal_net recommendation + the client-facing services that call it over
#               gRPC. Nginx is deliberately NOT on this network, so neither the
#               gateway nor `swagger-ui` can reach `recommendation:50051`.
#   data_net    postgres + redis + rabbitmq + mailpit, joined only by the
#               services that use them.
#
# A container reaches another container only through a shared network.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-longevia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-change-me}
      IDENTITY_DB: ${IDENTITY_DB:-identity_db}
      DIET_DB: ${DIET_DB:-diet_db}
      PROGRESS_DB: ${PROGRESS_DB:-progress_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-longevia}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Ephemeral in-memory cache (Q2: NO volume, wiped on every recreate).
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Local fake mail server. Web UI on MAILPIT_WEB_PORT, SMTP catcher on
  # MAILPIT_SMTP_PORT. No volume: mail is throwaway in dev.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - data_net

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    # Backend services are added to the compose network below; Nginx resolves
    # them through Docker's embedded DNS at request time (see nginx.conf).

  # Combined Swagger UI for the client-facing services, served at /swagger.
  # Each spec is fetched through the gateway; enable Swagger in Development only.
  swagger-ui:
    image: swaggerapi/swagger-ui
    environment:
      URLS: >-
        [{"url":"/api/identity/swagger/v1/swagger.json","name":"Identity"},
         {"url":"/api/diet/swagger/v1/swagger.json","name":"Diet"},
         {"url":"/api/progress/swagger/v1/swagger.json","name":"Progress"}]
    networks:
      - edge

  # -------------------------------------------------------------------------
  # .NET services (Phase 4: identity + worker live; diet/progress/
  # recommendation uncomment as each Dockerfile lands).
  #
  identity:
    build:
      context: ..
      dockerfile: src/Services/Identity/Dockerfile
    environment:
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=${IDENTITY_DB:-identity_db};Username=identity_user;Password=${POSTGRES_APP_PASSWORD:-change-me}
      RABBITMQ_HOST: rabbitmq
      JWT__KEY_ID: ${JWT__KEY_ID:-longevia-dev-01}
      JWT__SIGNING_PRIVATE_KEY: ${JWT__SIGNING_PRIVATE_KEY:-}
      JWT__SIGNING_PUBLIC_KEY: ${JWT__SIGNING_PUBLIC_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - edge
      - data_net
  #
  # diet:      ... (also calls recommendation over gRPC)
  #   networks: edge + internal_net + data_net
  # progress:  ... (same three networks as diet if it calls recommendation)
  #
  # recommendation:  ... (internal, gRPC-only, stateless, no database)
  #   networks: internal_net ONLY - must not be reachable from nginx/swagger-ui
  #
  worker:
    build:
      context: ..
      dockerfile: src/Services/Worker/Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      SMTP__HOST: ${SMTP__HOST:-mailpit}
      SMTP__PORT: ${SMTP__PORT:-1025}
      SMTP__USE_SSL: ${SMTP__USE_SSL:-false}
      SMTP__USER: ${SMTP__USER:-}
      SMTP__PASSWORD: ${SMTP__PASSWORD:-}
      SMTP__SENDER_EMAIL: ${SMTP__SENDER_EMAIL:-no-reply@longevia.local}
      REDIS__HOST: redis
      REDIS__PORT: ${REDIS_PORT:-6379}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edge
      - data_net
  #
  # JWT env (see .env.example and ADR 001):
  #   identity:  JWT__SIGNING_PRIVATE_KEY + JWT__SIGNING_PUBLIC_KEY + JWT__KEY_ID
  #   diet:      JWT__SIGNING_PUBLIC_KEY  + JWT__KEY_ID   (never the private key)
  #   progress:  JWT__SIGNING_PUBLIC_KEY  + JWT__KEY_ID   (never the private key)
  #   worker:    no JWT vars (never the private key)
  # -------------------------------------------------------------------------

networks:
  edge:
  internal_net:
  data_net:

volumes:
  postgres-data:
  rabbitmq-data:
