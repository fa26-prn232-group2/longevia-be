# Longevia production gateway (Nginx, TLS terminated here).
#
# Public URL: https://api.longevia.hycat.online:8446
# Only identity, diet and progress are routed. Recommendation stays internal
# (gRPC only) and is never reachable from this network.
#
# The certificate must exist before this container starts:
#   /etc/nginx/tls/api.longevia.hycat.online/{fullchain.pem,privkey.pem}

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    # CORS: the browser calls this API directly from the Vercel frontend.
    map $http_origin $cors_origin {
        default "";
        "https://longevia.hycat.online" $http_origin;
    }

    # Rate limiting: general API 30 r/s per IP; auth endpoints 5 r/s.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

    charset utf-8;
    charset_types application/json application/problem+json;

    # SSE/WebSocket support.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker embedded DNS; combined with variable proxy_pass so Nginx can start
    # before the backends and re-resolve names per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name api.longevia.hycat.online;

        # Container healthcheck uses plain HTTP on port 80; answer locally instead
        # of redirecting to the public HTTPS port (which is not listening inside).
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host:8446$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.longevia.hycat.online;

        ssl_certificate     /etc/nginx/tls/api.longevia.hycat.online/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/api.longevia.hycat.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        limit_req zone=api_general burst=30 nodelay;
        limit_req_status 429;

        # CORS preflight is answered by the gateway, never proxied.
        if ($request_method = OPTIONS) {
            return 204;
        }

        error_page 404 = @notfound;
        location @notfound {
            default_type application/problem+json;
            return 404 '{"type":"https://longevia.com/errors/not-found","title":"Không tìm thấy","status":404,"detail":"Đường dẫn API không tồn tại hoặc phương thức không được hỗ trợ."}';
        }

        error_page 502 503 504 /gateway_error;
        location = /gateway_error {
            internal;
            default_type application/problem+json;
            return 502 '{"type":"https://tools.ietf.org/html/rfc7807","title":"Dịch vụ không khả dụng","status":502,"detail":"Không thể kết nối đến dịch vụ phía sau hoặc dịch vụ đang khởi động."}\n';
        }

        error_page 429 = @ratelimited;
        location @ratelimited {
            default_type application/problem+json;
            return 429 '{"type":"https://tools.ietf.org/html/rfc7807","title":"Quá nhiều yêu cầu","status":429,"detail":"Bạn đã gửi quá nhiều yêu cầu. Vui lòng thử lại sau."}\n';
        }

        # Gateway liveness; independent of every backend and of the database.
        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/identity/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;
            set $identityauth http://identity:8080;
            rewrite ^/api/identity/(.*)$ /$1 break;
            proxy_pass $identityauth;
        }

        location /api/identity/ {
            set $identity http://identity:8080;
            rewrite ^/api/identity/(.*)$ /$1 break;
            proxy_pass $identity;
        }

        # Streaming knowledge answers: disable buffering and allow long turns.
        location = /api/diet/knowledge/ask/stream {
            set $diet_stream http://diet:8080;
            rewrite ^/api/diet/(.*)$ /$1 break;
            proxy_pass $diet_stream;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 120s;
        }

        location /api/diet/ {
            set $diet http://diet:8080;
            rewrite ^/api/diet/(.*)$ /$1 break;
            proxy_pass $diet;
        }

        location /api/progress/ {
            set $progress http://progress:8080;
            rewrite ^/api/progress/(.*)$ /$1 break;
            proxy_pass $progress;
        }
    }
}
