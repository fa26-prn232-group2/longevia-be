# Longevia API Gateway (Nginx).
#
# Only the client-facing services are exposed here: Identity, Diet, Progress.
# Recommendation is internal (gRPC-only) and is never routed through Nginx.
#
# The public URL is prefixed per service; the prefix is stripped before the
# request reaches the service, so each service owns its own route names.
#   /api/identity/**  -> identity:8080/**
#   /api/diet/**      -> diet:8080/**
#   /api/progress/**  -> progress:8080/**

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker embedded DNS. Combined with variable proxy_pass below, this lets
    # Nginx start even before the backend services are up, and re-resolve
    # names on every request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Forwarding headers, inherited by every location below.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gateway liveness, independent of backends.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Combined Swagger UI (dev). Served by the `swagger-ui` container.
        location = /swagger {
            return 301 /swagger/;
        }

        location /swagger/ {
            rewrite ^/swagger/(.*)$ /$1 break;
            set $swaggerui http://swagger-ui:8080;
            proxy_pass $swaggerui;
        }

        location /api/identity/ {
            rewrite ^/api/identity/(.*)$ /$1 break;
            set $identity http://identity:8080;
            proxy_pass $identity;
        }

        location /api/diet/ {
            rewrite ^/api/diet/(.*)$ /$1 break;
            set $diet http://diet:8080;
            proxy_pass $diet;
        }

        location /api/progress/ {
            rewrite ^/api/progress/(.*)$ /$1 break;
            set $progress http://progress:8080;
            proxy_pass $progress;
        }
    }
}
